<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @page { size: A4; margin: 20mm 15mm 25mm 15mm; }
      body { font-family: Arial, sans-serif; font-size: 12px; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
      th { background: #f3f3f3; }
      .footer { position: fixed; bottom: 0; width: 100%; font-size: 10px; text-align: center; color: #666; }
    </style>
  </head>
  <body>
    <h3>Attendance Report — {{ payload.month }}</h3>
    <table>
      <thead>
        <tr><th>Employee</th><th>Date</th><th>Status</th></tr>
      </thead>
      <tbody>
        {% for entry in payload.entries %}
        <tr><td>{{ entry.employee_name }}</td><td>{{ entry.date }}</td><td>{{ entry.status }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <div class="footer">Generated by CrossBill AI • Page <span class="pageNumber"></span></div>
  </body>
</html>
