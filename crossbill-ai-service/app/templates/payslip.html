<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @page { size: A4; margin: 20mm 15mm 25mm 15mm; }
      body { font-family: Arial, sans-serif; font-size: 12px; }
      .card { border: 1px solid #ddd; padding: 16px; }
      .footer { position: fixed; bottom: 0; width: 100%; font-size: 10px; text-align: center; color: #666; }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Payslip — {{ payload.month }}</h3>
      <p><strong>Employee:</strong> {{ payload.employee_name }}</p>
      <p><strong>Basic Salary:</strong> {{ payload.basic_salary }}</p>
      <p><strong>Allowances:</strong> {{ payload.allowances }}</p>
      <p><strong>Deductions:</strong> {{ payload.deductions }}</p>
      <p><strong>Net Pay:</strong> {{ payload.basic_salary + payload.allowances - payload.deductions }}</p>
    </div>
    <div class="footer">Generated by CrossBill AI • Page <span class="pageNumber"></span></div>
  </body>
</html>
